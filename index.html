<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ Your Special Valentine Message ❤️</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: pink;
            padding: 20px;
        }
        h1 {
            color: red;
        }
        h2 {
            color: darkred;
        }
        iframe {
            width: 560px;
            height: 315px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>❤️ Your Special Valentine Message ❤️</h1>
    <h2 id="message">Loading...</h2>
    
    <!-- YouTube Video for the song -->
    <iframe id="loveVideo" src="" frameborder="0" allowfullscreen></iframe>

    <script>
        // List of love messages
        const messages = [
            "You make my heart skip a beat! ❤️",
            "Every moment with you is special! 💖",
            "You are my everything! 🥰",
            "Love you more than words can say! 💕",
            "Happy Valentine's Day, my love! ❤️"
        ];

        // List of YouTube video IDs
        const videoIds = [
            "rIocYOk6pOY", // Your provided video
            "xvZqHgFz51I", // Example romantic song 1
            "JGwWNGJdvx8", // Example romantic song 2
            "OpQFFLBMEPI"  // Example romantic song 3
        ];

        // Function to get URL parameters
        function getQueryParam(param) {
            let urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param) || "";
        }

        // Get details from URL (optional, for custom name)
        let couple = getQueryParam("couple") || "My Love";

        // Randomly select a message and video
        let randomMessage = messages[Math.floor(Math.random() * messages.length)];
        let randomVideo = videoIds[Math.floor(Math.random() * videoIds.length)];

        // Display the message
        document.getElementById("message").innerHTML = 
            `💖 ${couple}, ${randomMessage} 💖`;

        // Set the YouTube video
        document.getElementById("loveVideo").src = `https://www.youtube.com/embed/${randomVideo}?autoplay=1`;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ Your Special Valentine Message ❤️</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: pink;
            padding: 20px;
        }
        h1 {
            color: red;
        }
        h2 {
            color: darkred;
        }
        iframe {
            width: 560px;
            height: 315px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>❤️ Your Special Valentine Message ❤️</h1>
    <h2 id="message">Loading...</h2>
    
    <!-- YouTube Video for the song -->
    <iframe id="loveVideo" src="" frameborder="0" allowfullscreen></iframe>

    <script>
        // Function to get URL parameters
        function getQueryParam(param) {
            let urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param) || "";
        }

        // Get details from URL
        let name = getQueryParam("name");
        let partner = getQueryParam("partner");
        let customMessage = getQueryParam("msg") || "You are my everything! ❤️";
        let videoId = getQueryParam("video") || "dQw4w9WgXcQ"; // Default video ID

        // Handle name formatting
        let displayName = "";
        if (name && partner) {
            displayName = `${name} & ${partner}`;
        } else if (name) {
            displayName = name;
        } else if (partner) {
            displayName = partner;
        } else {
            displayName = "My Love";
        }

        // Display the custom love message
        document.getElementById("message").innerHTML = 
            `💖 ${displayName}, ${customMessage} 💖`;

        // Set the YouTube video
        document.getElementById("loveVideo").src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
    </script>
</body>
</html>
